[package]
name = "https"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["full"] }
rcgen = "0.14.10"
tls-listener = { version = "0.11.2", features = ["rustls"] }
tokio = { version = "1.54.1", features = ["fs", "macros", "rt", "rt-multi-thread", "net"] }
tokio-rustls = "0.26.6"
tokio-util = "0.7.20"
