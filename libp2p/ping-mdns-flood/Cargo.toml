[package]
name = "ping-mdns-flood"
version = "0.1.0"
authors = ["hwipl"]
edition = "2024"

[dependencies]
# use current git version for dependency updates, dependabot fixes
libp2p = { git = "https://github.com/libp2p/rust-libp2p", rev = "70bf5e2f5c64cfa36405ccf9f4f1690afd8abf66", features = ["tokio", "mdns", "tcp", "tls", "noise", "yamux", "dns", "macros", "floodsub", "mdns"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_cbor = "0.11.2"
tokio = "1.53.1"
