[package]
name = "ping-mdns-flood"
version = "0.1.0"
authors = ["hwipl"]
edition = "2024"

[dependencies]
# use current git version for dependency updates, dependabot fixes
libp2p = { git = "https://github.com/libp2p/rust-libp2p", rev = "b4c6d6dcaccbae6c69bc5e579a50478911c6f157", features = ["tokio", "mdns", "tcp", "tls", "noise", "yamux", "dns", "macros", "floodsub", "mdns"] }
futures = "0.3.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_cbor = "0.11.2"
tokio = "1.53.1"
